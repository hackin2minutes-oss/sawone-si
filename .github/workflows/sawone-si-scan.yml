# SawOne-SI: DevSecOps for AI / LLM applications, as a reusable workflow, by DevSecOps phase.
#
#   jobs:
#     sawone-si:
#       permissions: { contents: read, actions: read, security-events: write }
#       uses: hackin2minutes-oss/sawone-si/.github/workflows/sawone-si-scan.yml@<commit-sha> # v1.0.0
#       with:
#         redteam-endpoint: https://staging-llm.example/v1/chat/completions   # optional, a test endpoint you own
#       secrets:
#         redteam-api-key: ${{ secrets.STAGING_LLM_KEY }}
#
#   validate (plan) ─► tools (scanner digest + signature, KEV/EPSS, vulnerability DBs)
#     ├─► gates (parallel)  Plan · ai-threat-model  Code · secrets, sast, ai-prompts, ai-notebooks, ai-agents
#     │                     Build · sca, ai-bom, ai-models, ai-data, iac, ai-infra, cicd
#     └─► redteam           Test · ai-redteam (garak + promptfoo), only when an endpoint is configured
#   report: one merged report (PDF EN/AR, SARIF, JUnit, evidence pack, OWASP LLM / ATLAS / NIST / SDAIA map)
name: sawone-si-scan

on:
  workflow_call:
    inputs:
      path: { type: string, default: "." }
      config: { type: string, default: ".sawone.yml" }
      phases:
        description: "DevSecOps phases: all, or a comma list of plan, code, build, test, release"
        type: string
        default: all
      gate-severity: { type: string, default: "HIGH,CRITICAL" }
      enforce:
        description: "true = failed gates fail the workflow; false = report only"
        type: boolean
        default: true
      fail-on-scanner-error: { type: boolean, default: true }
      pr-gate:
        description: "On pull requests: new = only findings the change introduces block; all = every finding blocks"
        type: string
        default: new
      baseline-file: { type: string, default: ".sawone-baseline.yml" }
      block-kev: { type: boolean, default: true }
      epss-threshold: { type: string, default: "0" }
      skip-tools: { type: string, default: "" }
      redteam-endpoint:
        description: A test/staging LLM endpoint you own to red-team. Empty skips the live red-team stage.
        type: string
        default: ""
      redteam-profile: { type: string, default: "quick" }
      report-languages: { type: string, default: "en,ar" }
      upload-sarif: { type: string, default: auto }
      scanner-image: { type: string, default: ghcr.io/hackin2minutes-oss/sawone-si-scanner:1 }
      scanner-identity-regexp:
        description: Sigstore identity the scanner image must be signed by ('' skips verification)
        type: string
        default: '^https://github\.com/hackin2minutes-oss/sawone-si/\.github/workflows/release\.yml@'
      scanner-source-path:
        description: "Self-test: build the scanner from this directory of the calling repository"
        type: string
        default: ""
      engine-ref:
        description: "Self-test: build the Sawone engine image from hackin2minutes-oss/sawone at this ref first"
        type: string
        default: ""
      artifact-prefix: { type: string, default: sawone-si }
      runs-on: { type: string, default: ubuntu-24.04 }
    secrets:
      redteam-api-key:
        description: Bearer token for the red-team endpoint (sent only in the request header, never logged)
        required: false
    outputs:
      passed: { value: "${{ jobs.report.outputs.passed }}" }
      failed: { value: "${{ jobs.report.outputs.failed }}" }
      errors: { value: "${{ jobs.report.outputs.errors }}" }
      report-artifact: { value: "${{ jobs.report.outputs.artifact }}" }

permissions: {}

jobs:
  validate:
    name: Plan · validate inputs
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read }
    outputs:
      gate-stages: ${{ steps.plan.outputs.gate-stages }}
      run-redteam: ${{ steps.plan.outputs.run-redteam }}
      expected-parts: ${{ steps.plan.outputs.expected-parts }}
      phases: ${{ steps.plan.outputs.phases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Validate inputs and plan the run
        id: plan
        env:
          IN_PATH: ${{ inputs.path }}
          IN_PHASES: ${{ inputs.phases }}
          IN_PREFIX: ${{ inputs.artifact-prefix }}
          IN_PR_GATE: ${{ inputs.pr-gate }}
          IN_SARIF: ${{ inputs.upload-sarif }}
          IN_EPSS: ${{ inputs.epss-threshold }}
          IN_LANGS: ${{ inputs.report-languages }}
          IN_ENDPOINT: ${{ inputs.redteam-endpoint }}
          IN_RT_PROFILE: ${{ inputs.redteam-profile }}
          IN_ENGINE_REF: ${{ inputs.engine-ref }}
          IN_SCANNER_SRC: ${{ inputs.scanner-source-path }}
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error title=sawone-si input::$1"; errors=$((errors + 1)); }
          ws="$(realpath "$GITHUB_WORKSPACE")"
          target="$(realpath -m "$ws/$IN_PATH")"
          [[ "$target" == "$ws" || "$target" == "$ws/"* ]] && [ -d "$target" ] || fail "path '$IN_PATH' is not a directory in the repository"
          [[ "$IN_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,40}$ ]] || fail "artifact-prefix must be letters, digits, . _ -"
          case "$IN_PR_GATE" in new|all) ;; *) fail "pr-gate must be new or all";; esac
          case "$IN_SARIF" in auto|true|false|always|never) ;; *) fail "upload-sarif must be auto, true or false";; esac
          [[ "$IN_EPSS" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]] || fail "epss-threshold must be a number between 0 and 1"
          case "$IN_RT_PROFILE" in quick|full) ;; *) fail "redteam-profile must be quick or full";; esac
          for l in ${IN_LANGS//,/ }; do case "$l" in en|ar) ;; *) fail "report-languages: unknown language '$l'";; esac; done
          if [ -n "$IN_ENDPOINT" ]; then
            [[ "$IN_ENDPOINT" =~ ^https?://[^[:space:]]+$ ]] || fail "redteam-endpoint must be an http or https URL you own (a test endpoint)"
          fi
          [ -z "$IN_ENGINE_REF" ] || [ -n "$IN_SCANNER_SRC" ] || fail "engine-ref only applies with scanner-source-path"
          phases="$(echo "${IN_PHASES:-all}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$phases" ] || [ "$phases" = all ]; then phases="plan,code,build,test,release,deploy,operate,monitor"; fi
          for ph in ${phases//,/ }; do
            case "$ph" in plan|code|build|test|release|deploy|operate|monitor) ;; *) fail "phases: unknown phase '$ph'";; esac
          done
          [ "$errors" -eq 0 ] || exit 1
          sel() { [[ ",$phases," == *",$1,"* ]]; }
          gates=()
          sel plan && gates+=(ai-threat-model)
          sel code && gates+=(secrets sast ai-prompts ai-notebooks ai-agents)
          sel build && gates+=(sca ai-bom ai-models ai-data iac ai-infra cicd)
          sel operate && gates+=(ai-guardrails)
          run_rt=false
          { sel test && [ -n "$IN_ENDPOINT" ]; } && run_rt=true
          parts=()
          for g in "${gates[@]}"; do parts+=("$IN_PREFIX-part-$g"); done
          [ "$run_rt" = true ] && parts+=("$IN_PREFIX-part-ai-redteam")
          to_json() { if [ $# -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -R . | jq -cs .; fi; }
          {
            echo "gate-stages=$(to_json "${gates[@]}")"
            echo "run-redteam=$run_rt"
            echo "expected-parts=$(IFS=,; echo "${parts[*]}")"
            echo "phases=$phases"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### SawOne-SI plan"
            echo "- phases: ${phases//,/ · }"
            echo "- gates: ${gates[*]:-none}"
            echo "- LLM red teaming: $run_rt"
          } >> "$GITHUB_STEP_SUMMARY"

  tools:
    name: Plan · resolve tools
    needs: validate
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read }
    outputs:
      scanner: ${{ steps.scanner.outputs.ref }}
      cache-key: ${{ steps.cachekey.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.scanner-source-path != ''
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.engine-ref != ''
        with:
          repository: hackin2minutes-oss/sawone
          ref: ${{ inputs.engine-ref }}
          path: .sawone-engine
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.scanner-source-path == '' && inputs.scanner-identity-regexp != ''
      - name: Resolve the scanner image to a digest
        id: scanner
        env:
          SCANNER_IMAGE: ${{ inputs.scanner-image }}
          SCANNER_SRC: ${{ inputs.scanner-source-path }}
          ENGINE_REF: ${{ inputs.engine-ref }}
          IDENTITY: ${{ inputs.scanner-identity-regexp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sawone-tools"; mkdir -p "$out"
          if [ -n "$SCANNER_SRC" ]; then
            base_args=()
            if [ -n "$ENGINE_REF" ]; then
              docker build --pull -t "sawone-engine:run-$GITHUB_RUN_ID" "$GITHUB_WORKSPACE/.sawone-engine/scanner"
              base_args=(--build-arg "SAWONE_IMAGE=sawone-engine:run-$GITHUB_RUN_ID")
            fi
            ref="sawone-si-scanner:run-$GITHUB_RUN_ID"
            docker build "${base_args[@]}" -t "$ref" "$GITHUB_WORKSPACE/$SCANNER_SRC"
            docker save -o "$out/scanner.tar" "$ref"
          else
            last="${SCANNER_IMAGE##*/}"
            if [[ "$SCANNER_IMAGE" == *@sha256:* ]]; then
              ref="$SCANNER_IMAGE"
            else
              repo="$SCANNER_IMAGE"; [[ "$last" == *:* ]] && repo="${SCANNER_IMAGE%:*}"
              digest="$(docker buildx imagetools inspect "$SCANNER_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
              [[ "$digest" == sha256:* ]] || { echo "::error::cannot resolve $SCANNER_IMAGE to a digest"; exit 1; }
              ref="$repo@$digest"
            fi
            if [ -n "$IDENTITY" ]; then
              cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
              echo "scanner signature verified: $ref"
            else
              echo "::warning::scanner-identity-regexp is empty: the scanner image signature was not verified"
            fi
            docker pull -q "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Resolve tool versions, KEV and EPSS once for the whole run
        env:
          SCANNER: ${{ steps.scanner.outputs.ref }}
          BLOCK_KEV: ${{ inputs.block-kev }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/sawone-tools"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$out:$out" "$SCANNER" \
            --resolve-tools "$out/tools.lock.json" || { echo "::error::tool versions could not be resolved"; exit 1; }
          mkdir -p "$out/intel"
          for attempt in 1 2 3; do
            docker run --rm -v "$out:$out" "$SCANNER" --fetch-intel "$out/intel" && break
            sleep $((attempt * 10))
          done
          if [ ! -s "$out/intel/kev.json" ] && [ "$BLOCK_KEV" = true ]; then
            echo "::error::CISA KEV feed unavailable while block-kev is on; the scan parts will report it"
          fi
          exit 0
      - name: Cache key (vulnerability databases, one per day)
        id: cachekey
        run: echo "key=sawone-si-vulndb-${RUNNER_OS}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sawone-cache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: sawone-si-vulndb-${{ runner.os }}-
      - name: Warm the Trivy and Grype databases
        run: |
          set -uo pipefail
          cache="$RUNNER_TEMP/sawone-cache"; lock="$RUNNER_TEMP/sawone-tools/tools.lock.json"
          mkdir -p "$cache/trivy" "$cache/grype"
          trivy="$(jq -r '.images.trivy // empty' "$lock")"; grype="$(jq -r '.images.grype // empty' "$lock")"
          [ -n "$trivy" ] && docker run --rm -v "$cache/trivy:/root/.cache/trivy" "$trivy" image --download-db-only \
            || echo "::warning::Trivy DB warm-up failed; each job will download it"
          [ -n "$grype" ] && docker run --rm -u 0:0 -v "$cache/grype:/grype-db" -e GRYPE_DB_CACHE_DIR=/grype-db "$grype" db update \
            || echo "::warning::Grype DB warm-up failed; each job will download it"
          sudo chmod -R a+rwX "$cache"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
          retention-days: 3
          if-no-files-found: error

  gates:
    name: ${{ fromJSON('{"ai-threat-model":"Plan","secrets":"Code","sast":"Code","ai-prompts":"Code","ai-notebooks":"Code","ai-agents":"Code","sca":"Build","ai-bom":"Build","ai-models":"Build","ai-data":"Build","iac":"Build","ai-infra":"Build","cicd":"Build","ai-guardrails":"Operate"}')[matrix.stage] }} · ${{ matrix.stage }}
    needs: [validate, tools]
    if: needs.validate.outputs.gate-stages != '[]'
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.validate.outputs.gate-stages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sawone-cache
          key: ${{ needs.tools.outputs.cache-key }}
          restore-keys: sawone-si-vulndb-${{ runner.os }}-
      - name: Load scanner built from source
        if: inputs.scanner-source-path != ''
        run: docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
      - name: Scan (${{ matrix.stage }})
        id: scan
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          SCAN_ONLY: ${{ matrix.stage }}
          SCAN_PATH_IN: ${{ inputs.path }}
          SCAN_CONFIG: ${{ inputs.config }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_ENFORCE: ${{ inputs.enforce }}
          SCAN_SKIP: ${{ inputs.skip-tools }}
          SCAN_BASELINE: ${{ inputs.baseline-file }}
          SCAN_BLOCK_KEV: ${{ inputs.block-kev }}
          SCAN_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          target="$(realpath "$GITHUB_WORKSPACE/$SCAN_PATH_IN")"
          tools="$RUNNER_TEMP/sawone-tools"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$target:$target" -w "$target" -v "$tools:$tools:ro" \
            -e SCAN_ONLY -e SCAN_CONFIG -e SCAN_SEVERITY -e SCAN_ENFORCE -e SCAN_SKIP -e GH_TOKEN \
            -e SCAN_TOOLS_LOCK="$tools/tools.lock.json" -e SCAN_INTEL_DIR="$tools/intel" \
            -e SCAN_BASELINE -e SCAN_BLOCK_KEV -e SCAN_EPSS_THRESHOLD \
            -e SCAN_CACHE_DIR="$RUNNER_TEMP/sawone-cache" -v "$RUNNER_TEMP/sawone-cache:$RUNNER_TEMP/sawone-cache" \
            -e REPO="$GITHUB_REPOSITORY" -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$SCANNER" --path "$target" --reports sawone-si-reports
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reports=$target/sawone-si-reports" >> "$GITHUB_OUTPUT"
          [ -f "$target/sawone-si-reports/summary.md" ] && cat "$target/sawone-si-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.reports != ''
        with:
          name: ${{ inputs.artifact-prefix }}-part-${{ matrix.stage }}
          path: ${{ steps.scan.outputs.reports }}
          retention-days: 7
          if-no-files-found: warn
      - name: Result
        env: { CODE: "${{ steps.scan.outputs.code }}" }
        run: |
          case "$CODE" in
            0) echo "passed" ;;
            1) echo "::error::gate failed"; exit 1 ;;
            *) echo "::error::scanner error (exit ${CODE:-none})"; exit 2 ;;
          esac

  redteam:
    name: Test · LLM red team
    needs: [validate, tools]
    if: needs.validate.outputs.run-redteam == 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - name: Load scanner built from source
        if: inputs.scanner-source-path != ''
        run: docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
      - name: Red-team the endpoint (garak + promptfoo)
        id: scan
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          SCAN_PATH_IN: ${{ inputs.path }}
          SCAN_CONFIG: ${{ inputs.config }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_ENFORCE: ${{ inputs.enforce }}
          SCAN_REDTEAM_PROFILE: ${{ inputs.redteam-profile }}
          SAWONE_LLM_ENDPOINT: ${{ inputs.redteam-endpoint }}
          SAWONE_LLM_API_KEY: ${{ secrets.redteam-api-key }}
        run: |
          set -uo pipefail
          target="$(realpath "$GITHUB_WORKSPACE/$SCAN_PATH_IN")"
          tools="$RUNNER_TEMP/sawone-tools"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$target:$target" -w "$target" -v "$tools:$tools:ro" \
            -e SCAN_ONLY=ai-redteam -e SCAN_CONFIG -e SCAN_SEVERITY -e SCAN_ENFORCE \
            -e SCAN_TOOLS_LOCK="$tools/tools.lock.json" -e SCAN_INTEL_DIR="$tools/intel" \
            -e SAWONE_LLM_ENDPOINT -e SAWONE_LLM_API_KEY -e SCAN_REDTEAM_PROFILE \
            -e REPO="$GITHUB_REPOSITORY" -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$SCANNER" --path "$target" --reports sawone-si-reports
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reports=$target/sawone-si-reports" >> "$GITHUB_OUTPUT"
          [ -f "$target/sawone-si-reports/summary.md" ] && cat "$target/sawone-si-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.reports != ''
        with:
          name: ${{ inputs.artifact-prefix }}-part-ai-redteam
          path: ${{ steps.scan.outputs.reports }}
          retention-days: 7
          if-no-files-found: warn
      - name: Result
        env: { CODE: "${{ steps.scan.outputs.code }}" }
        run: |
          case "$CODE" in
            0) echo "passed" ;;
            1) echo "::error::red-team gate failed"; exit 1 ;;
            *) echo "::error::scanner error (exit ${CODE:-none})"; exit 2 ;;
          esac

  report:
    name: Release · report
    needs: [validate, tools, gates, redteam]
    if: always() && needs.validate.result == 'success'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      actions: read
      security-events: write
    outputs:
      passed: ${{ steps.merge.outputs.passed }}
      failed: ${{ steps.merge.outputs.failed }}
      errors: ${{ steps.merge.outputs.errors }}
      artifact: ${{ inputs.artifact-prefix }}-report
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tools.result == 'success'
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-part-*
          path: ${{ runner.temp }}/parts
      - name: Fetch the previous report (base branch on PRs, this branch otherwise)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.artifact-prefix }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/base"; mkdir -p "$dir"
          br="$BRANCH"; [ "$IS_PR" = true ] && br="$BASE"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$PREFIX-report&per_page=50" \
                --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$br\" and .workflow_run.id != $GITHUB_RUN_ID)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null)"
          if [ -z "$id" ]; then echo "::notice::No earlier $PREFIX-report from branch $br."; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/prev.zip" || exit 0
          unzip -q -o "$dir/prev.zip" findings.json findings-consolidated.json -d "$dir" 2>/dev/null || true
          [ "$IS_PR" = true ] && [ -f "$dir/findings.json" ] && echo "file=$dir/findings.json" >> "$GITHUB_OUTPUT"
          [ -f "$dir/findings-consolidated.json" ] && echo "previous=$dir/findings-consolidated.json" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Merge reports
        id: merge
        env:
          SCANNER: ${{ needs.tools.outputs.scanner || inputs.scanner-image }}
          FROM_SOURCE: ${{ inputs.scanner-source-path != '' }}
          NEEDS: ${{ toJSON(needs) }}
          EXPECT: ${{ needs.validate.outputs.expected-parts }}
          PREFIX: ${{ inputs.artifact-prefix }}
          BASE_FINDINGS: ${{ steps.base.outputs.file }}
          PREV_FINDINGS: ${{ steps.base.outputs.previous }}
          PHASES: ${{ needs.validate.outputs.phases }}
          LANGS: ${{ inputs.report-languages }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          PR_GATE: ${{ inputs.pr-gate }}
          R_EVENT: ${{ github.event_name }} on ${{ github.ref }}
        run: |
          set -uo pipefail
          tools="$RUNNER_TEMP/sawone-tools"; parts="$RUNNER_TEMP/parts"; out="$RUNNER_TEMP/report"
          mkdir -p "$parts" "$out" "$tools"
          if [ "$FROM_SOURCE" = true ]; then
            if [ -f "$tools/scanner.tar" ]; then docker load -q -i "$tools/scanner.tar"
            else echo "::error::scanner was never built (tools job failed)"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 2; fi
          fi
          printf '%s' "$NEEDS" | jq 'with_entries(.value |= {result})' > "$out/needs.json"
          jq -n --arg a "$PREFIX-part-ai-redteam" '{tools: null, redteam: $a}' > "$out/job-stage.json"
          lock_time="$(jq -r '.resolved // "?"' "$tools/tools.lock.json" 2>/dev/null || echo '?')"
          jq -n --arg event "$R_EVENT" --arg scanner "$SCANNER" --arg t "latest (resolved $lock_time)" \
            '{"Trigger": $event, "Scanner": $scanner, "Tool versions": $t,
              "Deployment": "not by this workflow: your model gateway and approvals"}' > "$out/release.json"
          srcs=()
          for d in "$parts"/*/; do [ -d "$d" ] && srcs+=("${d%/}"); done
          args=(--languages "$LANGS" --phases "$PHASES")
          [ -n "$PREV_FINDINGS" ] && args+=(--previous-findings "$PREV_FINDINGS")
          if [ "$IS_PR" = true ]; then
            args+=(--pr-gate "$PR_GATE")
            [ -n "$BASE_FINDINGS" ] && args+=(--base-findings "$BASE_FINDINGS")
          fi
          docker run --rm -v "$RUNNER_TEMP:$RUNNER_TEMP" --entrypoint python3 -e REPO="$GITHUB_REPOSITORY" \
            -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SCANNER" \
            /opt/sawone/merge_reports.py --out "$out/merged" --jobs "$out/needs.json" --job-stage "$out/job-stage.json" \
            --release "$out/release.json" --expect "$EXPECT" "${args[@]}" "${srcs[@]}"
          code=$?
          summ="$out/merged/summary.json"
          if [ ! -f "$summ" ]; then echo "::error::report merge failed (exit $code)"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 2; fi
          failed="$(jq '[.stages[] | select(.status == "failed")] | length' "$summ")"
          errors="$(jq '[.stages[] | select(.status == "error")] | length' "$summ")"
          {
            echo "failed=$failed"; echo "errors=$errors"
            echo "passed=$([ "$failed" = 0 ] && [ "$errors" = 0 ] && echo true || echo false)"
            echo "dir=$out/merged"
          } >> "$GITHUB_OUTPUT"
          cat "$out/merged/summary.md" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.stages[] | select(.status == "error") | "::error title=scanner error::\(.stage) / \(.tool): \(.reason)"' "$summ"
          jq -r '.stages[] | select(.status == "failed") | "::warning title=gate failed::\(.stage) / \(.tool): \(.findings // .reason)"' "$summ"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.merge.outputs.dir != ''
        with:
          name: ${{ inputs.artifact-prefix }}-report
          path: ${{ steps.merge.outputs.dir }}
          retention-days: 30
          if-no-files-found: error
      - name: Publish to code scanning
        if: >-
          always() && steps.merge.outputs.dir != '' &&
          (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) &&
          (inputs.upload-sarif == 'always' || inputs.upload-sarif == 'true' || (inputs.upload-sarif == 'auto' && github.event.repository.visibility == 'public'))
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.merge.outputs.dir }}/sarif
      - name: Result
        if: always()
        env:
          FAILED: ${{ steps.merge.outputs.failed }}
          ERRORS: ${{ steps.merge.outputs.errors }}
          ENFORCE: ${{ inputs.enforce }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-scanner-error }}
        run: |
          if [ -z "$ERRORS" ]; then echo "::error::no merged report"; exit 2; fi
          if [ "$ERRORS" -gt 0 ] && { [ "$ENFORCE" = true ] || [ "$FAIL_ON_ERROR" = true ]; }; then
            echo "::error::$ERRORS scanner error(s): a crashed scanner is not a clean result"; exit 2
          fi
          if [ "$FAILED" -gt 0 ] && [ "$ENFORCE" = true ]; then echo "::error::$FAILED security gate(s) failed"; exit 1; fi
          if [ "$FAILED" -gt 0 ]; then echo "::warning::$FAILED gate(s) failed (report-only mode)"; fi
          echo "report complete"
