# Validates SawOne-SI on every change:
#   lint        actionlint + shellcheck + zizmor, every action pinned to a SHA
#   unit        pytest against the pinned Sawone engine (ENGINE_VERSION)
#   consumer    the reusable workflow called as a consumer would (scanner built from this commit) on the
#               vulnai fixture, asserting every AI stage fails on the planted flaws and the report is complete
#   redteam     build the red-team image and run its self-test (configs generated, garak + promptfoo present;
#               no endpoint is attacked)
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Install linters
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          python -m pip install --quiet actionlint-py shellcheck-py zizmor pyflakes
      - name: actionlint (includes shellcheck of every run block)
        run: actionlint -color
      - name: shellcheck the scripts
        run: shellcheck scripts/*.sh
      - name: pyflakes the scanner
        run: pyflakes scanner/*.py scanner/ai/*.py redteam/run.py tests/unit/*.py
      - name: every action pinned to a commit SHA
        run: scripts/pin-actions.sh --check
      - name: zizmor
        run: zizmor --config .github/zizmor.yml --offline .github/workflows action.yml
      - name: Install Graphviz System Dependency
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
        shell: bash


  engine:
    name: engine version
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      ref: ${{ steps.v.outputs.ref }}
