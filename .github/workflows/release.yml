# Builds and publishes the SawOne-SI images, on top of a pinned, signature-verified Sawone engine.
#   • on a v* tag: publish that version and move the major tag (e.g. :1)
#   • every Monday: rebuild the latest v1 release (fresh tools, base images)
#   • manual run: publish :edge from the branch (release tags untouched)
# Two images are published and signed: sawone-si-scanner (built FROM the Sawone engine) and
# sawone-si-redteam (garak + promptfoo). ENGINE_VERSION names the Sawone release the scanner is built FROM; its
# Sigstore signature is verified first.
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scanner:
    name: scanner image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Scheduled rebuilds use the latest v1 release, not unreleased main
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          tag="$(git tag -l 'v1.*' --sort=-v:refname | head -1)"
          [ -n "$tag" ] || { echo "::error::no v1.* release tag to rebuild"; exit 1; }
          git checkout --quiet "$tag"
          echo "rebuilding $tag"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve and verify the Sawone engine image
        id: engine
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          ver="$(tr -d '[:space:]' < ENGINE_VERSION)"
          [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::ENGINE_VERSION must be vX.Y.Z"; exit 1; }
          repo="ghcr.io/$owner/sawone-scanner"
          digest="$(docker buildx imagetools inspect "$repo:${ver#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "::error::Sawone $ver is not published"; exit 1; }
          cosign verify "$repo@$digest" \
            --certificate-identity-regexp "^https://github\.com/$owner/sawone/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "engine=$repo@$digest" >> "$GITHUB_OUTPUT"
          echo "Sawone engine $ver: $repo@$digest (signature verified)" >> "$GITHUB_STEP_SUMMARY"
      - name: Tags
        id: tags
        run: |
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/sawone-si-scanner"
          day="$(date -u +%Y%m%d)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            tags="$img:latest,$img:$day,$img:$v,$img:${v%%.*}"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            v="$(git describe --tags --exact-match HEAD)"; v="${v#v}"
            tags="$img:latest,$img:$day,$img:${v%%.*}"
          else
            tags="$img:edge,$img:edge-$day"
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scanner
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: SAWONE_IMAGE=${{ steps.engine.outputs.engine }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.engine.outputs.engine }}
      - name: Sign
        env:
          REF: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

  redteam:
    name: red-team image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Scheduled rebuilds use the latest v1 release
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          tag="$(git tag -l 'v1.*' --sort=-v:refname | head -1)"
          [ -n "$tag" ] || { echo "::error::no v1.* release tag to rebuild"; exit 1; }
          git checkout --quiet "$tag"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tags
        id: tags
        run: |
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/sawone-si-redteam"
          day="$(date -u +%Y%m%d)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            tags="$img:latest,$img:$day,$img:$v,$img:${v%%.*}"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            v="$(git describe --tags --exact-match HEAD)"; v="${v#v}"
            tags="$img:latest,$img:$day,$img:${v%%.*}"
          else
            tags="$img:edge,$img:edge-$day"
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64; garak's ML stack is x86-first)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: redteam
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign
        env:
          REF: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
