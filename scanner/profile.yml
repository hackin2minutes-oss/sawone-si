  "Plan, code, build and test run in this scan; release is the gate decision; deploy, operate and monitor happen in your model gateway and observability stack, which the report points to.": >-
    تُنفَّذ مراحل التخطيط والبرمجة والبناء والاختبار في هذا الفحص؛ والإصدار هو قرار البوابة؛ أما النشر والتشغيل
    والمراقبة فتتم في بوابة النموذج ومنظومة المراقبة التي يشير إليها التقرير.
  "your deployment pipeline (model gateway, approvals)": "خط النشر لديك (بوابة النموذج والموافقات)"
  "LLM observability and abuse monitoring": "مراقبة النموذج اللغوي وإساءة الاستخدام"
